<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview (design-system) — embed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="foundation.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="effectiveness.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("effx-theme")||"light")}catch(e){}</script>
  <style>
    html, body { margin: 0; background: var(--bg-interface-body); }
    /* Render the full design-system results app, then crop to just the Overview content. */
    .mainnav, .breadcrumb, .results-head, .fb-fab, #fb-btn { display: none !important; }
    .app { display: block !important; height: auto !important; overflow: visible !important; }
    .main { display: block !important; min-width: 0 !important; }
    .main-scroll { overflow: visible !important; height: auto !important; }
    /* Trim the design-system's generous top/bottom gutters so the embed has no dead scroll space.
       The host page already supplies the horizontal gutter, so the wrap runs full-bleed here —
       otherwise the Overview content would be 48px narrower than Focus view / Actions. */
    .overview-wrap { padding: var(--spacing-loose) 0 var(--spacing-base) 0 !important; max-width: none !important; }
    /* Keep the 3-up card grid — the DS drops to 2-up below a 1300px *viewport*, which the iframe always is.
       1fr columns so the row fills the shared 1200px content width exactly, whatever the gap is. */
    @media (min-width: 900px) {
      .ov-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; max-width: 1200px !important; }
      .ai-summary { max-width: 1200px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="effectiveness.js"></script>
  <script>
    // Render the design-system Overview (exact reference dataset + real Chart.js charts).
    renderOverview('team-it-after', 'overview');

    // The Highest/Lowest scores cards keep their design-system header pin: clicking it opens a
    // popover that lists the questions. Picking a question routes to the prototype's triage dialog
    // (instead of the DS "Select a goal" step). Capture-phase on document so this runs before the
    // DS's own per-item handler; scoped to the two score cards only.
    document.addEventListener('click', function(e){
      var item = e.target.closest && e.target.closest('.sc-pinlist-item');
      if(!item) return;
      var card = item.closest('.qs-card.is-low, .qs-card.is-high');
      if(!card) return;
      e.stopPropagation(); e.preventDefault();
      var which = card.classList.contains('is-high') ? 'high' : 'low';
      var name = item.getAttribute('data-pin-name') || (item.querySelector('.menu-item-title') || {}).textContent || '';
      var score = item.getAttribute('data-pin-score') || '';
      // close the DS popover so it isn't left open behind the dialog
      document.querySelectorAll('.sc-pin-pop').forEach(function(p){ p.hidden = true; });
      document.querySelectorAll('.sc-pin.is-pressed').forEach(function(b){ b.classList.remove('is-pressed'); });
      // Pass the design system's own pin state along: a question already pinned here (it has a goal,
      // and possibly actions) must open the prototype's side panel for editing, not the triage dialog.
      var meta = { pinned: item.classList.contains('is-pinned'), key: item.getAttribute('data-pin-key') };
      try {
        var st = actState(item.getAttribute('data-pin-key'));
        if(st){
          meta.pinned = meta.pinned || !!st.goal;
          meta.goal = st.goal || '';
          meta.desc = st.desc || '';
          meta.actions = (st.actions || []).map(function(a){ return { text: a.text || '', done: !!a.done, due: a.due || '', assignee: a.assignee || '' }; });
        }
      } catch(e){}
      if(window.parent && window.parent.openScoreStepFromEmbed){
        window.parent.openScoreStepFromEmbed((name || '').replace(/\s*\(\d+%\)\s*$/, '').trim(), (score || '').trim(), which, meta);
      }
    }, true);

    /* The prototype owns the pin state once a manager responds, so it writes back here: the pin
       count, the pinned rows and the "N action(s)" labels are re-derived from the design system's
       own store. Mirrors the DS's internal refresh(), which is a closure we cannot call. */
    window.applyPinFromParent = function(key, goal, actions){
      if(!key) return;
      try {
        var st = actState(key);
        st.goal = goal || '';
        st.actions = (actions || []).map(function(a){ return { text: a.text || '', done: !!a.done, due: a.due || '', assignee: a.assignee || '' }; });
        if(typeof syncPinsForKey === 'function') syncPinsForKey(key);
        refreshPinCounts();
      } catch(e){}
    };
    function refreshPinCounts(){
      document.querySelectorAll('.sc-pin-multi').forEach(function(wrap){
        var n = 0;
        wrap.querySelectorAll('.sc-pinlist-item').forEach(function(it){
          var st = actState(it.dataset.pinKey), pinned = !!st.goal;
          if(pinned) n++;
          it.classList.toggle('is-pinned', pinned);
          var pinIco = it.querySelector('.sc-pinlist-pin');
          if(pinIco) ['promote','improve','contemplate'].forEach(function(g){ pinIco.classList.toggle('is-goal-' + g, st.goal === g); });
          var m = it.querySelector('.sc-pinlist-meta');
          if(m) m.textContent = pinned ? ((st.actions || []).length + ' action(s)') : '';
        });
        var cnt = wrap.querySelector('.sc-pin-count'); if(cnt){ cnt.textContent = n; cnt.hidden = n === 0; }
        var btn = wrap.querySelector('.sc-pin'); if(!btn) return;
        btn.classList.toggle('is-pinned', n > 0);
        var ico = btn.querySelector('[data-icon]');
        if(ico){ var want = n > 0 ? 'pin-filled' : 'pin'; if(ico.dataset.icon !== want){ ico.dataset.icon = want; delete ico.dataset.iconLoaded; ico.innerHTML = ''; if(window.Icons) window.Icons.renderOne(ico); } }
        var txt = n > 0 ? (n + ' items with selected goal') : 'Pin: no status';
        btn.setAttribute('aria-label', txt);
        var tip = wrap.querySelector('.tooltip'); if(tip) tip.textContent = txt;
      });
    }

    // Report content height so the parent can size the iframe with no inner (or trailing) scroll.
    function reportHeight(){
      // Size to the overview content's true bottom. document.body.scrollHeight is inflated by the
      // toast/notification stack (a tall, empty fixed container), which left a large empty scroll
      // region below the last cards.
      var wrap = document.querySelector('.overview-wrap');
      var h;
      if(wrap){ var y = 0, el = wrap; while(el){ y += el.offsetTop; el = el.offsetParent; } h = y + wrap.offsetHeight + 8; }
      else { h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight); }
      try { if(window.parent) window.parent.postMessage({ type: 'ov-embed-height', height: h }, '*'); } catch(e){}
    }
    function boot(){ reportHeight(); setTimeout(reportHeight, 250); setTimeout(reportHeight, 800); }
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ setTimeout(boot, 60); }); }
    window.addEventListener('load', function(){ setTimeout(boot, 120); });
    window.addEventListener('resize', reportHeight);
  </script>
</body>
</html>
